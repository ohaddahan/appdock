name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  RUSTUP_TOOLCHAIN: '1.95.0'
  MACOSX_DEPLOYMENT_TARGET: '12.0'

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test release revision handling
        run: python3 scripts/test-release-revision.py
      - name: Read Cargo version and resolve release revision
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-revision.sh

  build:
    name: Build macOS (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.runner }}-${{ matrix.target }}
          cache-bin: false
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET SDKROOT
      - name: Verify native target
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_TARGET"
      - name: Check and test
        run: |
          cargo fmt --all --check
          cargo test --all-features --locked
          cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Package release app
        run: scripts/package.sh
      - name: Sign and notarize macOS app
        if: runner.os == 'macOS'
        timeout-minutes: 30
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          for name in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_APP_SPECIFIC_PASSWORD APPLE_ID APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/appdock-signing.keychain-db"
          certificate="$RUNNER_TEMP/appdock-signing.p12"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -k "$keychain" -T /usr/bin/codesign > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          rm -f "$certificate"
          identity="$(security find-identity -v -p codesigning "$keychain" | \
            awk -v team="($APPLE_TEAM_ID)" '/"Developer ID Application:/ && index($0, team) {print $2}')"
          if [[ ! "$identity" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo "::error::Expected exactly one valid Developer ID Application identity for APPLE_TEAM_ID"
            exit 1
          fi
          app="dist/AppDock.app"
          for binary in AppDock; do
            codesign --force --sign "$identity" --keychain "$keychain" \
              --options runtime --timestamp "$app/Contents/MacOS/$binary"
          done
          codesign --force --sign "$identity" --keychain "$keychain" \
            --options runtime --timestamp "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          submission="$RUNNER_TEMP/appdock-notarization.zip"
          result="$RUNNER_TEMP/appdock-notarization.json"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$submission"
          xcrun notarytool submit "$submission" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 20m --output-format json > "$result"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print("Notarization:", r.get("id"), r.get("status")); sys.exit(0 if r.get("status") == "Accepted" else 1)' "$result"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
      - name: Remove temporary macOS signing credentials
        if: always() && runner.os == 'macOS'
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/appdock-signing.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
          rm -f "$RUNNER_TEMP/appdock-signing.p12" "$RUNNER_TEMP/appdock-notarization.zip"
      - name: Verify and archive release app
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          lipo -verify_arch "$EXPECTED_ARCH" dist/AppDock.app/Contents/MacOS/AppDock
          mkdir -p release-assets
          archive="AppDock-${RELEASE_TAG}-macos-${EXPECTED_ARCH}.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/AppDock.app "release-assets/$archive"
          cd release-assets
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: appdock-macos-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Upload GitHub release assets
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: publish-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: appdock-macos-*
          merge-multiple: true
          path: release-assets
      - name: Verify downloaded archives
        working-directory: release-assets
        run: |
          test -f "AppDock-${RELEASE_TAG}-macos-arm64.zip"
          test -f "AppDock-${RELEASE_TAG}-macos-x86_64.zip"
          sha256sum --check ./*.sha256
      - name: Create release if needed and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            args=()
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes "${args[@]}"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
